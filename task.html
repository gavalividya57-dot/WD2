<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>

    <title>Portfolio Website</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Font Awesome -->
    <link rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"/>

    <style>

        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
            font-family: Arial, Helvetica, sans-serif;
        }

        body{
            background:#0b0f19;
            color:white;
        }

        /* Navbar */

        .navbar{
            padding:20px 8%;
            background:#0b0f19;
        }

        .navbar-brand{
            color:white;
            font-size:28px;
            font-weight:bold;
        }

        .navbar-brand span{
            color:#00ffff;
        }

        .nav-link{
            color:white !important;
            margin-left:20px;
            transition:0.3s;
        }

        .nav-link:hover{
            color:#00ffff !important;
        }

        /* Home Section */

        .home{
            min-height:100vh;
            display:flex;
            align-items:center;
            padding:50px 8%;
        }

        .home-text h3{
            font-size:32px;
            font-weight:600;
        }

        .home-text h1{
            font-size:60px;
            font-weight:bold;
            margin:10px 0;
        }

        .home-text h2{
            font-size:35px;
            margin-bottom:20px;
        }

        .home-text span{
            color:#00ffff;
        }

        .home-text p{
            color:#cfcfcf;
            line-height:28px;
            max-width:550px;
        }

        /* Social Icons */

        .social-icons{
            margin:25px 0;
        }

        .social-icons a{
            width:45px;
            height:45px;
            display:inline-flex;
            align-items:center;
            justify-content:center;
            border:2px solid #00ffff;
            border-radius:50%;
            color:#00ffff;
            text-decoration:none;
            margin-right:15px;
            transition:0.3s;
        }

        .social-icons a:hover{
            background:#00ffff;
            color:#0b0f19;
            box-shadow:0 0 20px #00ffff;
        }

        /* Button */

        .btn-custom{
            background:#00ffff;
            color:#000;
            padding:12px 30px;
            border-radius:30px;
            font-weight:bold;
            text-decoration:none;
            display:inline-block;
            transition:0.3s;
            box-shadow:0 0 15px #00ffff;
        }

        .btn-custom:hover{
            background:white;
            color:black;
        }

        /* Image */

        .home-img{
            text-align:center;
        }

        .hexagon{
            width:350px;
            height:380px;
            background:#00ffff;
            clip-path:polygon(25% 5%, 75% 5%, 100% 50%, 75% 95%, 25% 95%, 0% 50%);
            display:flex;
            align-items:center;
            justify-content:center;
            box-shadow:0 0 30px #00ffff;
            margin:auto;
        }

        .hexagon img{
            width:320px;
            height:350px;
            object-fit:cover;
            clip-path:polygon(25% 5%, 75% 5%, 100% 50%, 75% 95%, 25% 95%, 0% 50%);
        }

        /* Responsive */

        @media(max-width:991px){

            .home{
                flex-direction:column-reverse;
                text-align:center;
            }

            .home-text h1{
                font-size:45px;
            }

            .home-text h2{
                font-size:28px;
            }

            .home-img{
                margin-bottom:40px;
            }
        }

    </style>
</head>

<body>

    <!-- Navbar -->

    <nav class="navbar navbar-expand-lg navbar-dark">
        <div class="container-fluid">

            <a class="navbar-brand" href="#">Portfo<span>lio.</span></a>

            <button class="navbar-toggler" type="button" data-bs-toggle="collapse"
                data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>

            <div class="collapse navbar-collapse justify-content-end" id="navbarNav">

                <ul class="navbar-nav">

                    <li class="nav-item">
                        <a class="nav-link active text-info" href="#">Home</a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link" href="#">About</a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link" href="#">Skills</a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link" href="#">Portfolio</a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link" href="#">Contact</a>
                    </li>

                </ul>

            </div>

        </div>
    </nav>

    <!-- Home Section -->

    <section class="home">

        <div class="container">
            <div class="row align-items-center">

                <!-- Text -->

                <div class="col-lg-6 home-text">

                    <h3>Hello, It's Me</h3>

                    <h1>John Kendric</h1>

                    <h2>And I'm a <span>Frontend Developer</span></h2>

                    <p>
                        Lorem ipsum dolor sit amet consectetur adipisicing elit.
                        Possimus nulla sed saepe rerum animi expedita.
                    </p>

                    <!-- Social Icons -->

                    <div class="social-icons">

                        <a href="#"><i class="fab fa-facebook-f"></i></a>

                        <a href="#"><i class="fab fa-twitter"></i></a>

                        <a href="#"><i class="fab fa-instagram"></i></a>

                        <a href="#"><i class="fab fa-linkedin-in"></i></a>

                    </div>

                    <a href="#" class="btn-custom">Download CV</a>

                </div>

                <!-- Image -->

                <div class="col-lg-6 home-img">

                    <div class="hexagon">

                        <img src="https://images.unsplash.com/photo-1500648767791-00dcc994a43e?q=80&w=1000&auto=format&fit=crop"
                        alt="profile">

                    </div>

                </div>

            </div>
        </div>

    </section>

    <!-- Bootstrap JS -->

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>, initial-scale=1.0">
